<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#382448" />
    <meta name="description" content="Una pausa para ti, un detalle para compartir. En Onky’s, los pequeños momentos se disfrutan a tu manera. Personaliza tus favoritos y registra tu pedido con SINPE Móvil." />
    <title>Onky’s — Pequeños momentos, a tu manera</title>
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-serif-display-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-serif-display-latin-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/images/bolsa-mix.webp" as="image" type="image/webp" fetchpriority="high" />
    <link rel="preload" href="/images/ositos-bolsa.webp" as="image" type="image/webp" />
    <link rel="preload" href="/images/mix/bear-amber.webp" as="image" type="image/webp" />
    <link rel="preload" href="/images/mix/bear-ruby.webp" as="image" type="image/webp" />
    <link rel="preload" href="/images/mix/bear-citrus.webp" as="image" type="image/webp" />
    <link rel="preload" href="/images/mix/bear-gold.webp" as="image" type="image/webp" />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute;pointer-events:none;left:-9999px;top:-9999px;" aria-hidden="true" focusable="false">
      <defs>
        <filter id="onkys-liquid-glass" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="1.3" result="blur" />
          <feSpecularLighting in="blur" surfaceScale="3.8" specularConstant="1.1" specularExponent="34" lighting-color="#ffffff" result="specular">
            <fePointLight x="160" y="-60" z="180" />
          </feSpecularLighting>
          <feComposite in="specular" in2="SourceAlpha" operator="in" result="specular-clipped" />
          <feOffset in="SourceAlpha" dx="0" dy="1" result="offset" />
          <feComposite in="SourceGraphic" in2="offset" operator="over" result="base" />
          <feBlend in="specular-clipped" in2="base" mode="screen" result="lit" />
          <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#1f092b" flood-opacity="0.22" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
