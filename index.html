<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#382448" />
    <meta name="description" content="Una pausa para ti, un detalle para compartir. En Onky’s, los pequeños momentos se disfrutan a tu manera. Personaliza tus favoritos y registra tu pedido con SINPE Móvil." />
    <title>Onky’s</title>
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;" aria-hidden="true" focusable="false">
      <defs>
        <filter id="onkys-liquid-glass" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur" />
          <feSpecularLighting in="blur" surfaceScale="3.6" specularConstant="1.35" specularExponent="28" lighting-color="#f8f4fb" result="specular">
            <fePointLight x="160" y="-60" z="180" />
          </feSpecularLighting>
          <feComposite in="specular" in2="SourceAlpha" operator="in" result="specular-clipped" />
          <feBlend in="specular-clipped" in2="SourceGraphic" mode="screen" result="lit" />
          <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1f092b" flood-opacity="0.18" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <noscript>Activa JavaScript para explorar los productos y realizar tu pedido en Onky’s.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
